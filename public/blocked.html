<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission Blocked</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: url('blocker-bg.png') center/cover no-repeat;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .streak-display {
      position: fixed;
      right: 145px;
      top: 190px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }

    .streak-number {
      font-size: 24px;
      font-weight: 900;
      color: #744210;
      font-family: 'Monaco', 'Courier New', monospace;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="streak-display">
      <div class="streak-number" id="streakNumber">1</div>
    </div>
  </div>

  <script>
    function computeGlobalStreak() {
      const sessions = JSON.parse(localStorage.getItem('bmo_sessions') || '[]');
      const completedDates = new Set(sessions.filter(s => s.completed).map(s => s.date));
      
      if (completedDates.size === 0) return 0;

      const today = new Date();
      let streak = 0;
      let currentDate = new Date(today.toLocaleDateString('en-CA'));

      for (let i = 0; i < 365; i++) {
        const dateStr = currentDate.toLocaleDateString('en-CA');
        if (completedDates.has(dateStr)) {
          streak++;
          currentDate.setDate(currentDate.getDate() - 1);
        } else {
          break;
        }
      }

      return streak;
    }

    function updateStreak() {
      const streak = computeGlobalStreak();
      document.getElementById('streakNumber').textContent = streak;
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateStreak();
      setInterval(updateStreak, 2000);
    });
  </script>
</body>
</html>
