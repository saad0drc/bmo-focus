<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMO - Stay Focused</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Comic Sans MS', 'Trebuchet MS', cursive;
      background: linear-gradient(135deg, #E8F5E9 0%, #F0F4F8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1F4E5A;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(78, 205, 196, 0.15);
      border: 3px solid #4ECDC4;
      padding: 40px;
      max-width: 900px;
      width: 90%;
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 40px;
      align-items: start;
    }

    /* LEFT: BMO Face */
    .bmo-face {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 300px;
    }

    .bmo-face svg {
      width: 240px;
      height: 240px;
      animation: bmo-pulse 2s ease-in-out infinite;
    }

    @keyframes bmo-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* CENTER: Task & Message */
    .center-section {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .task-info {
      background: linear-gradient(135deg, rgba(78, 205, 196, 0.1), rgba(107, 203, 119, 0.1));
      padding: 20px;
      border-radius: 16px;
      border: 2px solid #4ECDC4;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .task-icon {
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .task-icon svg {
      width: 100%;
      height: 100%;
    }

    .task-details h2 {
      font-size: 24px;
      color: #1F4E5A;
      margin-bottom: 8px;
      font-weight: 900;
    }

    .task-details p {
      font-size: 14px;
      color: #1F4E5A;
      opacity: 0.7;
    }

    .message-box {
      background: #FFE4E1;
      padding: 24px;
      border-radius: 12px;
      border-left: 5px solid #FF5E5E;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #1F4E5A;
      line-height: 1.6;
    }

    .button {
      background: linear-gradient(135deg, #4ECDC4, #1F4E5A);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(78, 205, 196, 0.3);
    }

    /* RIGHT: Stats */
    .stats-section {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .stat-box {
      background: rgba(78, 205, 196, 0.08);
      padding: 16px;
      border-radius: 12px;
      border: 2px solid rgba(78, 205, 196, 0.3);
      text-align: center;
    }

    .stat-label {
      font-size: 12px;
      font-weight: bold;
      color: #1F4E5A;
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 36px;
      font-weight: 900;
      color: #4ECDC4;
      text-shadow: 0 2px 4px rgba(78, 205, 196, 0.2);
    }

    .streak-box {
      background: linear-gradient(135deg, rgba(255, 217, 61, 0.15), rgba(255, 217, 61, 0.05));
      border: 2px solid #FFD93D;
    }

    .streak-box .stat-value {
      color: #FFD93D;
    }

    .seven-days {
      background: rgba(78, 205, 196, 0.08);
      padding: 16px;
      border-radius: 12px;
      border: 2px solid rgba(78, 205, 196, 0.3);
    }

    .seven-days-label {
      font-size: 12px;
      font-weight: bold;
      color: #1F4E5A;
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .day-label {
      font-size: 10px;
      font-weight: bold;
      color: #1F4E5A;
      opacity: 0.5;
    }

    .day-value {
      height: 40px;
      background: linear-gradient(180deg, #4ECDC4, #1F4E5A);
      border-radius: 4px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      font-size: 10px;
      color: white;
      font-weight: bold;
      padding-bottom: 2px;
      min-height: 8px;
    }

    .day-value.zero {
      background: #E8F5E9;
      border: 1px solid #ddd;
    }

    .timer {
      background: linear-gradient(135deg, #FF5E5E, #E63946);
      color: white;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .bmo-face svg {
        width: 160px;
        height: 160px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- LEFT: BMO Face -->
    <div class="bmo-face" id="bmoFace">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
        <!-- BMO Screen/Body -->
        <rect x="20" y="20" width="216" height="216" rx="24" fill="#4ECDC4" stroke="#1F4E5A" stroke-width="8"/>
        <!-- Screen Display -->
        <rect x="40" y="40" width="176" height="176" rx="16" fill="#E8F5E9" stroke="#1F4E5A" stroke-width="6"/>
        <!-- Left Eye -->
        <g>
          <rect x="55" y="65" width="45" height="55" rx="4" fill="#1F4E5A"/>
          <rect x="62" y="72" width="18" height="22" fill="#E8F5E9" rx="2"/>
          <circle cx="71" cy="83" r="4" fill="#1F4E5A"/>
        </g>
        <!-- Right Eye -->
        <g>
          <rect x="156" y="65" width="45" height="55" rx="4" fill="#1F4E5A"/>
          <rect x="163" y="72" width="18" height="22" fill="#E8F5E9" rx="2"/>
          <circle cx="172" cy="83" r="4" fill="#1F4E5A"/>
        </g>
        <!-- Mouth - happy curve -->
        <path d="M 70 130 Q 128 150 186 130" stroke="#1F4E5A" stroke-width="8" fill="none" stroke-linecap="round"/>
        <!-- Buttons on side -->
        <circle cx="35" cy="140" r="6" fill="#1F4E5A"/>
        <circle cx="35" cy="165" r="6" fill="#1F4E5A"/>
      </svg>
    </div>

    <!-- CENTER: Task & Message -->
    <div class="center-section">
      <div class="task-info">
        <div class="task-icon" id="taskIcon">
          <!-- SVG will be inserted here -->
        </div>
        <div class="task-details">
          <h2 id="taskName">Study TOP</h2>
          <p id="sessionInfo">Session 2/4 • Focus Mode</p>
        </div>
      </div>

      <div class="message-box" id="messageBox">
        Stay focused, friend 💛
      </div>

      <div class="timer" id="timer">25:00 remaining</div>
    </div>

    <!-- RIGHT: Stats -->
    <div class="stats-section">
      <div class="stat-box streak-box">
        <div class="stat-label">Day Streak</div>
        <div class="stat-value" id="streak">12</div>
      </div>

      <div class="seven-days">
        <div class="seven-days-label">Last 7 Days</div>
        <div class="days-grid" id="daysGrid">
          <!-- Day bars will be inserted here -->
        </div>
      </div>
    </div>
  </div>

  <script src="characterSvgs.js"></script>
  <script>
    let blockData = {};
    let timerInterval = null;

    // Character-specific messages
    const characterMessages = {
      '#4ECDC4': [
        "Stay focused, friend 💛",
        "Let's finish this mission together 🤝",
        "You got this! 💪"
      ],
      '#5B9BD5': [
        "Dude, keep it together! 🎩",
        "This is your mathematical destiny! 📐",
        "Don't break the chain! 🔗"
      ],
      '#FFB6C1': [
        "Oh my Glob! Get back to work! 👑",
        "This is unacceptable, bestie! 💎",
        "Focus! It's mathematical! ✨"
      ],
      '#FF6B9D': [
        "Yo, stay on task! 🔥",
        "Stop fooling around! ⚡",
        "Get back in there! 💯"
      ],
      '#9370DB': [
        "Come on, focus! 🌙",
        "Get back to your mission! 🎭",
        "No distractions! 🚫"
      ]
    };

    // Calculate global streak from completed sessions
    function computeGlobalStreak(sessions) {
      const completedSessions = sessions.filter(s => s.completed);
      const datesWithPomodoros = new Set(completedSessions.map(s => s.date));
      
      let streak = 0;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      // Count consecutive days backwards from today
      for (let i = 0; i < 365; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const dateStr = d.toLocaleDateString('en-CA');
        
        if (datesWithPomodoros.has(dateStr)) {
          streak++;
        } else {
          break;
        }
      }
      
      return streak;
    }

    function loadAllData() {
      chrome.storage.local.get(['bmo_tasks', 'bmo_activeTaskId', 'bmo_timer_state', 'bmo_sessions'], (result) => {
        try {
          const tasks = result.bmo_tasks 
            ? (typeof result.bmo_tasks === 'string' ? JSON.parse(result.bmo_tasks) : result.bmo_tasks)
            : [];
          
          const activeTaskId = result.bmo_activeTaskId;
          const activeTask = tasks.find(t => t.id === activeTaskId);
          const timerState = result.bmo_timer_state;
          const sessions = result.bmo_sessions 
            ? (typeof result.bmo_sessions === 'string' ? JSON.parse(result.bmo_sessions) : result.bmo_sessions)
            : [];

          if (!activeTask || !timerState) {
            console.error('[Blocker] Missing active task or timer state');
            return;
          }

          blockData = {
            mode: timerState.mode || 'focus',
            taskName: activeTask.title,
            globalStreak: computeGlobalStreak(sessions),
            sessionInCurrentRound: timerState.sessionInCurrentRound || 0,
            sessionsPerRound: timerState.settings?.sessionsPerRound || 4,
            endTime: timerState.endTime,
            taskColor: activeTask.color || '#4ECDC4',
            charSvg: CHARACTER_SVGS[activeTask.color] || CHARACTER_SVGS['#4ECDC4'],
            domain: timerState.blockedDomain || 'unknown',
            sessions: sessions
          };

          updateUI();
          updateTimer();
        } catch (e) {
          console.error('[Blocker] Failed to load data:', e);
        }
      });
    }

    function getLast7DaysData() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const data = [];

      for (let i = 6; i >= 0; i--) {
        const date = new Date(today);
        date.setDate(date.getDate() - i);
        const dateStr = date.toLocaleDateString('en-CA');
        
        const count = (blockData.sessions || []).filter(s => s.date === dateStr).length;
        data.push({ date: dateStr, count: count, dayLabel: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][date.getDay()] });
      }

      return data;
    }

    function updateUI() {
      const mode = blockData.mode || 'focus';

      // Update task name and session
      document.getElementById('taskName').textContent = blockData.taskName || 'Current Task';
      const modeText = mode === 'focus' ? 'Focus Mode' : mode === 'shortBreak' ? 'Short Break' : 'Long Break';
      document.getElementById('sessionInfo').textContent = 
        `Session ${(blockData.sessionInCurrentRound || 0) + 1}/${blockData.sessionsPerRound || 4} • ${modeText}`;

      // Update character SVG
      if (blockData.charSvg) {
        const container = document.getElementById('taskIcon');
        container.innerHTML = blockData.charSvg;
        const svg = container.querySelector('svg');
        if (svg) {
          svg.style.width = '80px';
          svg.style.height = '80px';
        }
      }

      // Update message based on character
      const messages = characterMessages[blockData.taskColor] || characterMessages['#4ECDC4'];
      const randomMsg = messages[Math.floor(Math.random() * messages.length)];
      document.getElementById('messageBox').textContent = randomMsg;

      // Update streak - use global streak from sessions
      document.getElementById('streak').textContent = blockData.globalStreak || '0';

      // Update 7-day chart
      const last7Days = getLast7DaysData();
      const maxCount = Math.max(...last7Days.map(d => d.count), 1);
      
      const daysGrid = document.getElementById('daysGrid');
      daysGrid.innerHTML = last7Days.map(day => `
        <div class="day-bar">
          <div class="day-label">${day.dayLabel}</div>
          <div class="day-value ${day.count === 0 ? 'zero' : ''}" style="height: ${day.count === 0 ? '8px' : Math.max(8, (day.count / maxCount) * 40) + 'px'}">
            ${day.count > 0 ? day.count : ''}
          </div>
        </div>
      `).join('');
    }

    function updateTimer() {
      if (!blockData.endTime) return;
      
      const now = Date.now();
      const timeLeftMs = Math.max(0, blockData.endTime - now);
      const mins = Math.floor(timeLeftMs / 60000);
      const secs = Math.floor((timeLeftMs % 60000) / 1000);
      const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')} remaining`;
      document.getElementById('timer').textContent = formatted;
    }

    // Load initially
    loadAllData();
    setInterval(loadAllData, 2000);
    
    // Update timer every 100ms
    timerInterval = setInterval(updateTimer, 100);

    window.addEventListener('beforeunload', () => {
      if (timerInterval) clearInterval(timerInterval);
    });
  </script>
</body>
</html>
