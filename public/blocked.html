<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission Blocked</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      max-width: 1100px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 350px 220px;
      gap: 80px;
      padding: 80px;
    }

    .left-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 400px;
    }

    .urgent-badge {
      display: inline-block;
      background: #DC2626;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 1.2px;
      width: fit-content;
    }

    .title {
      font-size: 52px;
      font-weight: 900;
      line-height: 1;
      color: #0F172A;
      letter-spacing: -2px;
    }

    .message {
      font-size: 15px;
      color: #374151;
      line-height: 1.6;
      font-weight: 500;
    }

    .ascii-face {
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 28px;
      color: #1F2937;
      margin-top: 12px;
      font-weight: bold;
      white-space: pre;
      letter-spacing: 4px;
      line-height: 1.4;
    }

    .center-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      justify-content: flex-start;
    }

    .character-icon {
      width: 280px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    .character-icon svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .character-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .block-message {
      background: #D1D5DB;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #1F2937;
      text-align: center;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      width: 100%;
      min-width: 220px;
    }

    .lock-icon {
      font-size: 14px;
    }

    .right-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-top: 20px;
    }

    .streak-badge {
      background: linear-gradient(135deg, #FEF3C7 0%, #FCD34D 100%);
      padding: 20px 16px;
      border-radius: 12px;
      text-align: center;
      border: 2px solid #FBBF24;
    }

    .streak-icon {
      font-size: 44px;
      margin-bottom: 10px;
    }

    .streak-label {
      font-size: 10px;
      font-weight: 800;
      color: #D97706;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .streak-note {
      font-size: 12px;
      color: #744210;
      margin-top: 6px;
      font-weight: 600;
    }

    .streak-message {
      font-size: 11px;
      color: #7C2D12;
      margin-top: 10px;
      line-height: 1.4;
      font-weight: 500;
    }

    @media (max-width: 1200px) {
      .container {
        grid-template-columns: 1fr;
        gap: 40px;
        padding: 40px;
      }
      
      .left-section {
        max-width: 100%;
      }
      
      .center-section {
        order: -1;
      }
      
      .right-section {
        justify-self: start;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Left Section -->
    <div class="left-section">
      <div class="urgent-badge">URGENT MISSION</div>
      <div class="title" id="mainTitle">YOU ARE WASTING THE MISSION.</div>
      <div class="message" id="mainMessage">Hey... stop making BMO sad.<br />F***ING STUDY.</div>
      <div class="ascii-face" id="asciiEmoji">. .
:-</div>
    </div>

    <!-- Center Section -->
    <div class="center-section">
      <div class="character-icon" id="characterIcon"></div>
      <div class="block-message">
        <span class="lock-icon">🔒</span>
        <span>NO ALLOWANCE.<br />BACK TO THE CODING MINES.</span>
      </div>
    </div>

    <!-- Right Section -->
    <div class="right-section">
      <div class="streak-badge">
        <div class="streak-icon">❌</div>
        <div class="streak-label">STREAK PAUSED</div>
        <div class="streak-note" id="streakNote">(Wasted Potential)</div>
        <div class="streak-message">Don't let us un-invite you!</div>
      </div>
    </div>
  </div>

  <script src="characterSvgs.js"></script>
  <script>
    const CHARACTER_MESSAGES = {
      '#4ECDC4': {
        title: 'YOU ARE WASTING THE MISSION.',
        message: 'Hey... stop making BMO sad.\nF***ING STUDY.',
        emoji: '. .\n:-'
      },
      '#6BCB77': {
        title: 'DUDE, WHAT ARE YOU DOING?',
        message: 'Yo, get back to it!\nAdventure awaits!',
        emoji: '^ ^\n:-)'
      },
      '#FFD93D': {
        title: 'OH MY GLOB, SWEETIE!',
        message: 'Return to studying!\nDon\'t disappoint us!',
        emoji: 'o o\n:-)'
      },
      '#FF5E5E': {
        title: 'BACK OFF, DUDE.',
        message: 'This is not cool.\nFocus up NOW.',
        emoji: '- -\n:('
      },
      '#1F4E5A': {
        title: 'YO, FOCUS UP!',
        message: 'Stop wasting time!\nGet it together.',
        emoji: '. .\n:/'
      }
    };

    function computeGlobalStreak() {
      const sessions = JSON.parse(localStorage.getItem('bmo_sessions') || '[]');
      const completedDates = new Set(sessions.filter(s => s.completed).map(s => s.date));
      
      if (completedDates.size === 0) return 0;

      const today = new Date();
      let streak = 0;
      let currentDate = new Date(today.toLocaleDateString('en-CA'));

      for (let i = 0; i < 365; i++) {
        const dateStr = currentDate.toLocaleDateString('en-CA');
        if (completedDates.has(dateStr)) {
          streak++;
          currentDate.setDate(currentDate.getDate() - 1);
        } else {
          break;
        }
      }

      return streak;
    }

    function loadAllData() {
      const tasks = JSON.parse(localStorage.getItem('bmo_tasks') || '[]');
      const blockData = JSON.parse(sessionStorage.getItem('bmo_blockData') || '{}');
      
      const task = tasks.find(t => t.id === blockData.taskId);
      const color = task?.color || '#4ECDC4';
      
      const selected = CHARACTER_MESSAGES[color] || CHARACTER_MESSAGES['#4ECDC4'];

      document.getElementById('mainTitle').textContent = selected.title;
      document.getElementById('mainMessage').innerHTML = selected.message;
      document.getElementById('asciiEmoji').textContent = selected.emoji;

      const iconSVG = CHARACTER_SVGS?.[color];
      if (iconSVG) {
        document.getElementById('characterIcon').innerHTML = iconSVG;
      }

      const streak = computeGlobalStreak();
      document.getElementById('streakNote').textContent = '(' + streak + ' day streak)';
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadAllData();
      setInterval(loadAllData, 2000);
    });
  </script>
</body>
</html>
