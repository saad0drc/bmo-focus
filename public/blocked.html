<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMO - Stay Focused</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #E8F5E9 0%, #F0F4F8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1F4E5A;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 40px;
      width: 90%;
      max-width: 1200px;
      padding: 40px;
    }

    /* LEFT PANEL */
    .left-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 24px;
      font-size: 14px;
    }

    .mode-badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 12px;
      letter-spacing: 1px;
      width: fit-content;
    }

    .mode-badge.focus {
      background: #FF5E5E;
      color: white;
    }

    .mode-badge.break {
      background: #6BCB77;
      color: white;
    }

    .mode-badge.longbreak {
      background: #FFD93D;
      color: #1F4E5A;
    }

    .timer {
      font-size: 48px;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      font-family: 'Courier New', monospace;
      color: #1F4E5A;
    }

    .session-info {
      font-size: 14px;
      color: #1F4E5A;
      opacity: 0.7;
    }

    /* CENTER PANEL - HEART */
    .center-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    .heart-container {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: heart-pulse 0.8s ease-in-out infinite;
    }

    @keyframes heart-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    @keyframes heart-crack {
      0% { 
        filter: drop-shadow(0 0 0px #FF5E5E);
        transform: scale(1);
      }
      20% { 
        transform: scale(0.98) rotate(1deg);
      }
      40% { 
        transform: scale(0.96) rotate(-1deg);
        filter: drop-shadow(0 0 8px rgba(255, 94, 94, 0.4));
      }
      60% { 
        transform: scale(0.98) rotate(0deg);
      }
      100% { 
        filter: drop-shadow(0 0 0px #FF5E5E);
        transform: scale(1);
      }
    }

    @keyframes heart-heal {
      0% { 
        filter: drop-shadow(0 0 8px rgba(107, 203, 119, 0.6));
      }
      100% { 
        filter: drop-shadow(0 0 0px #6BCB77);
      }
    }

    .heart-container.cracked {
      animation: heart-crack 0.5s ease-in-out;
    }

    .heart-container.healing {
      animation: heart-heal 0.6s ease-in-out;
    }

    .heart-container.cracked {
      animation: heart-crack 0.5s ease-out;
    }

    @keyframes heart-crack {
      0% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(0.98) rotate(-2deg); }
      75% { transform: scale(0.98) rotate(2deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .heart-svg {
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
    }

    .message {
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      color: #1F4E5A;
      line-height: 1.4;
      max-width: 300px;
    }

    .task-name {
      font-size: 18px;
      font-weight: bold;
      color: #4ECDC4;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .button {
      padding: 12px 28px;
      border: 2px solid #4ECDC4;
      background: white;
      color: #4ECDC4;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .button:hover {
      background: #4ECDC4;
      color: white;
      transform: translateY(-2px);
    }

    /* RIGHT PANEL */
    .right-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 32px;
      align-items: flex-end;
    }

    .streak-box {
      text-align: right;
    }

    .streak-number {
      font-size: 48px;
      font-weight: bold;
      color: #FFD93D;
    }

    .streak-label {
      font-size: 12px;
      font-weight: bold;
      color: #1F4E5A;
      opacity: 0.6;
      letter-spacing: 1px;
    }

    .motto {
      font-size: 14px;
      font-weight: 600;
      color: #1F4E5A;
      opacity: 0.7;
      text-align: right;
      line-height: 1.5;
      max-width: 180px;
    }

    /* Character SVG */
    .char-svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
    }

    @media (max-width: 1024px) {
      .container {
        grid-template-columns: 1fr;
        gap: 32px;
      }

      .left-panel, .right-panel {
        align-items: center;
        text-align: center;
      }

      .right-panel {
        align-items: center;
      }

      .motto {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- LEFT PANEL -->
    <div class="left-panel">
      <div>
        <div class="mode-badge focus" id="modeBadge">FOCUS</div>
      </div>
      <div>
        <div class="timer" id="timer">25:00</div>
      </div>
      <div class="session-info" id="sessionInfo">
        Session 2/4
      </div>
    </div>

    <!-- CENTER PANEL -->
    <div class="center-panel">
      <div class="char-svg" id="charSvg"></div>
      <div class="heart-container" id="heart">
        <svg class="heart-svg" width="140" height="140" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#D4A574;stop-opacity:1" />
              <stop offset="50%" style="stop-color:#C9915E;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#B8742E;stop-opacity:1" />
            </linearGradient>
          </defs>
          <path d="M50,90 C20,70 5,55 5,40 C5,25 15,15 25,15 C35,15 45,25 50,32 C55,25 65,15 75,15 C85,15 95,25 95,40 C95,55 80,70 50,90 Z" fill="url(#heartGradient)" stroke="#8B5A1F" stroke-width="1.5" />
        </svg>
      </div>
      <div class="task-name" id="taskName">Study TOP</div>
      <div class="message" id="message">hey… this isn't part of the mission 👀</div>
      <button class="button" id="allowBtn">Allow for this session</button>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
      <div class="streak-box">
        <div class="streak-number" id="streak">12</div>
        <div class="streak-label">DAY STREAK</div>
      </div>
      <div class="motto">don't break<br>the chain</div>
    </div>
  </div>

  <script src="characterSvgs.js"></script>
  <script>
    let blockData = {};
    let timerInterval = null;

    // Load initial data from chrome.storage
    chrome.storage.local.get(['blockedData', 'bmo_tasks', 'bmo_activeTaskId'], (result) => {
      if (result.blockedData) {
        blockData = result.blockedData;
        
        // Enrich blockData with real task info
        if (result.bmo_tasks && result.bmo_activeTaskId) {
          try {
            const tasks = typeof result.bmo_tasks === 'string' 
              ? JSON.parse(result.bmo_tasks) 
              : result.bmo_tasks;
            const activeTask = tasks.find(t => t.id === result.bmo_activeTaskId);
            if (activeTask) {
              blockData.streak = activeTask.dailyStreak || 0;
              blockData.completedPomodoros = activeTask.completedPomodoros || 0;
              blockData.taskName = activeTask.title;
            }
          } catch (e) {
            console.error('[Blocker] Failed to parse tasks:', e);
          }
        }
        
        updateUI();
        playBlockSound();
        updateTimer(); // Update timer immediately
      }
    });

    function updateUI() {
      // Set mode badge
      const modeBadge = document.getElementById('modeBadge');
      modeBadge.textContent = blockData.mode === 'focus' ? 'FOCUS' : blockData.mode === 'shortBreak' ? 'BREAK' : 'LONG BREAK';
      modeBadge.className = `mode-badge ${blockData.mode === 'focus' ? 'focus' : blockData.mode === 'shortBreak' ? 'break' : 'longbreak'}`;

      // Set session info
      document.getElementById('sessionInfo').textContent = blockData.sessionInfo || 'Session 1/4';

      // Set character SVG
      if (blockData.charSvg) {
        document.getElementById('charSvg').innerHTML = blockData.charSvg;
      }

      // Set task name
      document.getElementById('taskName').textContent = blockData.taskName || 'Current Task';

      // Set streak (real data from task)
      document.getElementById('streak').textContent = blockData.streak || '0';

      // Apply crack animation on load
      triggerHeartCrack();
    }

    function triggerHeartCrack() {
      const heart = document.getElementById('heart');
      heart.classList.remove('cracked');
      void heart.offsetWidth; // Trigger reflow to restart animation
      heart.classList.add('cracked');
    }

    function playBlockSound() {
      // Blocked/crack sound via Web Audio API
      try {
        const audioContext = new (window.AudioContext || (window as any).webkitAudioContext)();
        const now = audioContext.currentTime;
        
        // Crack sound - short high-low burst
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        
        osc.connect(gain);
        gain.connect(audioContext.destination);
        
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
        
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        
        osc.start(now);
        osc.stop(now + 0.05);

        // Second tone
        const osc2 = audioContext.createOscillator();
        const gain2 = audioContext.createGain();
        
        osc2.connect(gain2);
        gain2.connect(audioContext.destination);
        
        osc2.frequency.setValueAtTime(200, now + 0.06);
        gain2.gain.setValueAtTime(0.12, now + 0.06);
        gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
        
        osc2.start(now + 0.06);
        osc2.stop(now + 0.16);
      } catch (e) {
        console.error('Failed to play block sound:', e);
      }
    }

    function playHealSound() {
      // Heal sound - pop/recovery via Web Audio API
      try {
        const audioContext = new (window.AudioContext || (window as any).webkitAudioContext)();
        const now = audioContext.currentTime;
        
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        
        osc.connect(gain);
        gain.connect(audioContext.destination);
        
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
        
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0, now + 0.15);
        
        osc.start(now);
        osc.stop(now + 0.15);
      } catch (e) {
        console.error('Failed to play heal sound:', e);
      }
    }

    // Timer state for live updates
    let timerEndTime = null;
    
    // Real-time timer updates - calculate locally for smooth display
    function updateTimer() {
      chrome.storage.local.get(['bmo_timer_state'], (result) => {
        if (result.bmo_timer_state && result.bmo_timer_state.endTime) {
          // Store endTime on first call, then use it for smooth updates
          if (!timerEndTime) {
            timerEndTime = result.bmo_timer_state.endTime;
          }
          
          const timeLeftMs = Math.max(0, timerEndTime - Date.now());
          const mins = Math.floor(timeLeftMs / 60000);
          const secs = Math.floor((timeLeftMs % 60000) / 1000);
          const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
          document.getElementById('timer').textContent = formatted;
          
          // If timer expired, update one more time from storage
          if (timeLeftMs <= 0) {
            clearInterval(timerInterval);
          }
        }
      });
    }

    timerInterval = setInterval(updateTimer, 500);  // Update every 500ms for smooth display

    // Allow for this session button
    document.getElementById('allowBtn').addEventListener('click', () => {
      if (window.chrome && window.chrome.extension) {
        const domain = blockData.domain;
        chrome.runtime.sendMessage({ 
          action: 'allowDomainTemporarily', 
          domain: domain 
        }, () => {
          playHealSound();
          // Close the tab or go back
          setTimeout(() => window.history.back(), 200);
        });
      }
    });

    // Clean up on unload
    window.addEventListener('beforeunload', () => {
      if (timerInterval) clearInterval(timerInterval);
    });
  </script>
</body>
</html>
